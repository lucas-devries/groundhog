name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  id-token: write # npm trusted publishing
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run fallow -- dead-code
      - name: Publish unless this version is already on npm
        run: |
          v=$(node -p 'require("./package.json").version')
          if npm view "groundhog-cli@$v" version > /dev/null 2>&1; then
            echo "groundhog-cli@$v is already on npm"
          else
            npm publish
          fi
